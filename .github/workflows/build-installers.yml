name: Build macOS and Android installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag
        required: true
        default: v1.2.0

permissions:
  contents: write

jobs:
  macos:
    name: macOS universal DMG
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build unsigned universal DMG
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: word-wiggle-macos
          path: release/*.dmg
          if-no-files-found: error

  android:
    name: Android tablet APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Sync web app into Android
        run: npx cap sync android
      - name: Build installable APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Name release package
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/Word-Wiggle-${{ inputs.release_tag }}-Android-tablet.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: word-wiggle-android
          path: release/*.apk
          if-no-files-found: error

  release:
    name: Publish both installers
    needs: [macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: word-wiggle-*
          path: release
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release/* --title "Word Wiggle $TAG" --generate-notes --latest --repo "$GITHUB_REPOSITORY"
          fi
